spring:
  datasource:
    url: jdbc:h2:mem:coursesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # update simplifica este ejercicio; en un proyecto real se recomienda
      # Flyway/Liquibase con ddl-auto=validate.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
