spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:courses_db}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Conexiones acotadas: la VM e2-micro (Always Free) tiene ~1GB de RAM
      # compartido entre la JVM y MySQL, asi que se evita un pool grande.
      maximum-pool-size: 5
  jpa:
    hibernate:
      # update simplifica este ejercicio; en un proyecto real se recomienda
      # Flyway/Liquibase con ddl-auto=validate.
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoint:
    health:
      show-details: never
