spring:
  datasource:
    url: jdbc:h2:mem:coursesdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # SOLO para desarrollo local. En produccion, JWT_SECRET es obligatorio via variable de entorno.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
